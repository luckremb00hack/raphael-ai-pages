<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saluti Multilingue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Saluti in Diverse Lingue</h1>
  </header>
  <div class="button-container">
    <button id="btn-it" aria-label="Saluta in italiano">Italiano</button>
    <button id="btn-en" aria-label="Saluta in inglese">English</button>
    <button id="btn-es" aria-label="Saluta in spagnolo">Español</button>
  </div>
  <script>
    document.getElementById('btn-it').addEventListener('click', () => alert('Ciao!'));
    document.getElementById('btn-en').addEventListener('click', () => alert('Hello!'));
    document.getElementById('btn-es').addEventListener('click', () => alert('¡Hola!'));
  </script>
</body>
</html>
